[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-interrupt-mvp"
version = "0.1.0"
description = "The Cart Interrupt MVP - Blinkit Cross-Category Expansion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "httpx>=0.24.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Vercel's Python builder cannot find the ASGI app in a default location
# (app.py / main.py / api/index.py), so point it at ours explicitly.
[tool.vercel]
entrypoint = "discovery.api.app:app"
