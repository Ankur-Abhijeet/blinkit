[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-interrupt-mvp"
version = "0.1.0"
description = "The Cart Interrupt MVP - Blinkit Cross-Category Expansion"
readme = "README.md"
requires-python = ">=3.11"
# Must stay in sync with requirements.txt — Vercel installs from this file
# once [tool.vercel] is present, and the app imports fastapi at module level.
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Vercel's Python builder cannot find the ASGI app in a default location
# (app.py / main.py / api/index.py), so point it at ours explicitly.
[tool.vercel]
entrypoint = "discovery.api.app:app"
