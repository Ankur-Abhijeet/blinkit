services:
  - type: web
    name: blinkit-mvp-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python3 -m discovery.offline.catalog_generator"
    startCommand: "uvicorn discovery.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
